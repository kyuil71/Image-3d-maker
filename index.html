<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1012">
<title>K-MESH · Image to 3D</title>
<style>
:root{
  --bg:#0f1012; --panel:#17181b; --panel2:#1f2125; --line:#2c2f35;
  --text:#ecebe8; --sub:#9a9ca3; --accent:#d9c6a3; --accent2:#8fb3c9;
  --ok:#7fc49a; --warn:#e2b25c; --err:#e07a6e;
  --r:14px; --dock:68px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif}
.app{max-width:430px;margin:0 auto;min-height:100vh;
  padding:calc(var(--sat) + 14px) 16px calc(var(--dock) + var(--sab) + 24px)}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
header h1{font-size:20px;letter-spacing:.06em;margin:0;font-weight:700}
header h1 b{color:var(--accent)}
header span{font-size:16px;color:var(--sub)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px;color:var(--accent);font-weight:600;letter-spacing:.02em}
label,.lbl{font-size:16px;color:var(--sub);display:block;margin:10px 0 6px}
input[type=text],input[type=number],input[type=url]{width:100%;font-size:16px;padding:11px 12px;
  border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
input[type=range]{width:100%;accent-color:var(--accent)}
button{font:inherit;font-size:16px;cursor:pointer;border-radius:11px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);padding:11px 14px}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);color:#1a1712;border-color:var(--accent);font-weight:700;width:100%;padding:15px}
button.primary:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;color:var(--sub)}
.seg button.on{background:var(--accent);color:#1a1712;font-weight:700}
.seg small{display:block;font-size:16px;opacity:.75}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:16px;padding:4px 10px;border-radius:99px;
  background:var(--panel2);border:1px solid var(--line);color:var(--sub)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--sub)}
.chip.ok i{background:var(--ok)} .chip.warn i{background:var(--warn)} .chip.err i{background:var(--err)}
.val{float:right;color:var(--text)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);min-height:200px;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:10px;text-align:center;color:var(--sub);overflow:hidden;position:relative;
  background:repeating-conic-gradient(#1a1b1e 0 25%,#151619 0 50%) 0 0/18px 18px}
.drop img{max-width:100%;max-height:300px;display:block}
.pick{display:flex;gap:8px;margin-top:10px}
.pick button{flex:1}
details summary{font-size:16px;color:var(--sub);cursor:pointer;padding:6px 0}
.bar{height:8px;background:var(--panel2);border-radius:9px;overflow:hidden;margin:10px 0 6px}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .4s}
.muted{color:var(--sub);font-size:16px}
.err{color:var(--err);font-size:16px;white-space:pre-wrap}
.hide{display:none!important}
.split{display:flex;gap:10px;align-items:center}
.split img{width:84px;height:84px;object-fit:contain;border-radius:10px;
  background:repeating-conic-gradient(#1a1b1e 0 25%,#151619 0 50%) 0 0/12px 12px}

/* viewer */
.stage{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 50% 20%,#2a2c31,#121315)}
#cv{width:100%;height:min(108vw,460px);display:block;touch-action:none}
.stage .hud{position:absolute;left:10px;bottom:10px;right:10px;display:flex;justify-content:space-between;
  font-size:16px;color:#cfd0d4;pointer-events:none;text-shadow:0 1px 3px #000}
.stage .tl{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.stage .tl button{padding:7px 10px;background:#000a;border-color:#fff2}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sw{display:flex;align-items:center;gap:10px;padding:9px 10px;text-align:left}
.sw i{width:26px;height:26px;border-radius:50%;flex:0 0 26px;border:1px solid #fff3}
.sw.on{border-color:var(--accent);background:#2a261f}
.toggle{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--panel2);border-radius:10px;padding:8px 4px}
.stats b{display:block;font-size:17px}
.stats span{font-size:16px;color:var(--sub)}

/* history */
.hist{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel2)}
.hist img{width:64px;height:64px;object-fit:contain;border-radius:8px;background:#111}
.hist .meta{flex:1;font-size:16px;color:var(--sub)}
.hist .meta b{color:var(--text);display:block}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#0f1012ee;backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:var(--sab)}
.dock nav{max-width:430px;margin:0 auto;display:flex;height:var(--dock)}
.dock button{flex:1;border:0;background:transparent;border-radius:0;color:var(--sub);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:16px}
.dock button svg{width:22px;height:22px}
.dock button.on{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock) + var(--sab) + 14px);
  background:#26282d;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:16px;z-index:20;
  opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<div class="app">
  <header>
    <h1>K-<b>MESH</b></h1>
    <span>Image → 3D · TRELLIS.2</span>
  </header>

  <!-- ===== 생성 ===== -->
  <section id="tab-gen">
    <div class="card">
      <h2>① GPU 서버</h2>
      <input id="srv" type="url" placeholder="https://xxxx.trycloudflare.com" autocomplete="off">
      <div class="row" style="margin-top:8px">
        <button id="btnPing">연결 확인</button>
        <span id="srvChip" class="chip" style="flex:1.4;justify-content:center"><i></i>미연결</span>
      </div>
    </div>

    <div class="card">
      <h2>② 이미지</h2>
      <div class="drop" id="drop">
        <div id="dropHint">사물 한 개가 또렷한 사진<br>배경은 자동으로 제거됩니다</div>
        <img id="srcImg" class="hide" alt="">
      </div>
      <div class="pick">
        <button id="btnCam">카메라</button>
        <button id="btnGal">갤러리</button>
      </div>
      <input id="fCam" type="file" accept="image/*" capture="environment" class="hide">
      <input id="fGal" type="file" accept="image/*" class="hide">
    </div>

    <div class="card">
      <h2>③ 설정</h2>
      <span class="lbl">해상도</span>
      <div class="seg" id="segRes">
        <button data-v="512">512<small>빠름</small></button>
        <button data-v="1024" class="on">1024<small>균형</small></button>
        <button data-v="1536">1536<small>정밀</small></button>
      </div>
      <label>폴리곤 수 <span class="val" id="vDec">30만</span></label>
      <input id="dec" type="range" min="20000" max="1000000" step="10000" value="300000">
      <span class="lbl">텍스처</span>
      <div class="seg" id="segTex">
        <button data-v="1024">1K</button>
        <button data-v="2048" class="on">2K</button>
        <button data-v="4096">4K</button>
      </div>
      <div class="toggle"><span>배경 자동 제거</span><input id="rmbg" type="checkbox" checked></div>
      <div class="toggle"><span>시드 랜덤</span><input id="seedRand" type="checkbox" checked></div>
      <input id="seed" type="number" value="0" min="0" class="hide">
      <details>
        <summary>고급 설정</summary>
        <label>샘플링 스텝 <span class="val" id="vSteps">12</span></label>
        <input id="steps" type="range" min="4" max="50" step="1" value="12">
        <label>구조 가이던스 <span class="val" id="vSs">7.5</span></label>
        <input id="ssg" type="range" min="1" max="10" step="0.1" value="7.5">
        <label>형상 가이던스 <span class="val" id="vSh">7.5</span></label>
        <input id="shg" type="range" min="1" max="10" step="0.1" value="7.5">
        <label>재질 가이던스 <span class="val" id="vTx">1.0</span></label>
        <input id="txg" type="range" min="1" max="10" step="0.1" value="1.0">
      </details>
    </div>

    <button class="primary" id="btnGen" disabled>3D 생성</button>

    <div class="card hide" id="prog" style="margin-top:12px">
      <div class="split">
        <img id="pvImg" alt="" class="hide">
        <div style="flex:1">
          <b id="pStage">대기열</b>
          <div class="bar"><div id="pBar"></div></div>
          <span class="muted" id="pTime">0초</span>
        </div>
      </div>
      <div class="err hide" id="pErr"></div>
    </div>
  </section>

  <!-- ===== 뷰어 ===== -->
  <section id="tab-view" class="hide">
    <div class="stage">
      <canvas id="cv"></canvas>
      <div class="tl">
        <button id="btnRot">회전</button>
        <button id="btnFit">맞춤</button>
      </div>
      <div class="hud"><span id="hudName">샘플</span><span id="hudMode">원본 PBR</span></div>
    </div>

    <div class="card" style="margin-top:12px">
      <h2>표시</h2>
      <div class="seg" id="segMode">
        <button data-v="pbr" class="on">원본</button>
        <button data-v="clay">클레이</button>
        <button data-v="wire">와이어</button>
        <button data-v="normal">노멀</button>
      </div>
    </div>

    <div class="card">
      <h2>CMF 소재 입히기</h2>
      <div class="swatches" id="sw"></div>
      <div class="toggle"><span>생성된 컬러 유지</span><input id="keepColor" type="checkbox"></div>
      <label>컬러 <span class="val"><input id="col" type="color" value="#2b2b2d" style="width:44px;height:28px;border:0;background:none;padding:0"></span></label>
      <label>거칠기 (Roughness) <span class="val" id="vRo">-</span></label>
      <input id="ro" type="range" min="0" max="1" step="0.01" value="0.5">
      <label>금속성 (Metalness) <span class="val" id="vMe">-</span></label>
      <input id="me" type="range" min="0" max="1" step="0.01" value="0">
      <label>클리어코트 <span class="val" id="vCc">-</span></label>
      <input id="cc" type="range" min="0" max="1" step="0.01" value="0">
    </div>

    <div class="card">
      <h2>조명</h2>
      <label>환경광 세기 <span class="val" id="vEnv">1.0</span></label>
      <input id="env" type="range" min="0" max="3" step="0.05" value="1">
      <label>환경 회전 <span class="val" id="vEnvR">0°</span></label>
      <input id="envR" type="range" min="0" max="360" step="1" value="0">
      <div class="toggle"><span>바닥 그림자</span><input id="shadow" type="checkbox" checked></div>
    </div>

    <div class="card">
      <h2>모델 정보</h2>
      <div class="stats">
        <div><b id="sTri">-</b><span>삼각형</span></div>
        <div><b id="sVer">-</b><span>정점</span></div>
        <div><b id="sSize">-</b><span>용량</span></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="btnDl">GLB 저장</button>
        <button id="btnShot">PNG 캡처</button>
      </div>
      <button id="btnOpen" style="width:100%;margin-top:8px">내 GLB 파일 열기</button>
      <input id="fGlb" type="file" accept=".glb,.gltf,model/gltf-binary" class="hide">
    </div>
  </section>

  <!-- ===== 기록 ===== -->
  <section id="tab-hist" class="hide">
    <div class="card">
      <h2>이번 세션 생성 기록</h2>
      <div id="histList"><p class="muted">아직 생성한 모델이 없습니다.</p></div>
    </div>
  </section>
</div>

<div class="dock"><nav>
  <button data-tab="gen" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-9 8"/></svg>생성</button>
  <button data-tab="view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>뷰어</button>
  <button data-tab="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>기록</button>
</nav></div>
<div class="toast" id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
function toast(msg, ms = 2400) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}
const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(n);

/* ---------------- 탭 ---------------- */
let viewerReady = false;
document.querySelectorAll('.dock button').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));
function showTab(name) {
  document.querySelectorAll('.dock button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
  ['gen', 'view', 'hist'].forEach((n) => $('tab-' + n).classList.toggle('hide', n !== name));
  if (name === 'view') { if (!viewerReady) initViewer(); resize(); }
  window.scrollTo(0, 0);
}

/* ---------------- 세그먼트 ---------------- */
function seg(id, cb) {
  const el = $(id);
  el.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    el.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    cb && cb(b.dataset.v);
  });
  return () => el.querySelector('.on').dataset.v;
}
const getRes = seg('segRes');
const getTex = seg('segTex');

const bindVal = (id, out, f = (v) => v) => {
  const el = $(id); const upd = () => ($(out).textContent = f(el.value));
  el.addEventListener('input', upd); upd();
};
bindVal('dec', 'vDec', (v) => (v >= 1e6 ? '100만' : Math.round(v / 1e4) + '만'));
bindVal('steps', 'vSteps'); bindVal('ssg', 'vSs', (v) => (+v).toFixed(1));
bindVal('shg', 'vSh', (v) => (+v).toFixed(1)); bindVal('txg', 'vTx', (v) => (+v).toFixed(1));
$('seedRand').addEventListener('change', (e) => $('seed').classList.toggle('hide', e.target.checked));

/* ---------------- 서버 ---------------- */
const srv = $('srv');
const sameOrigin = /^https?:$/.test(location.protocol) && !/github\.io$/.test(location.hostname);
srv.value = store.get('kmesh.srv', sameOrigin ? location.origin : '');
srv.addEventListener('change', () => { srv.value = srv.value.trim().replace(/\/+$/, ''); store.set('kmesh.srv', srv.value); });
const base = () => srv.value.trim().replace(/\/+$/, '');
let serverOk = false;

function setChip(state, text) {
  const c = $('srvChip'); c.className = 'chip ' + state; c.innerHTML = '<i></i>' + text;
}
async function ping(silent) {
  if (!base()) { setChip('', '주소 입력'); serverOk = false; updateGen(); return; }
  if (location.protocol === 'https:' && base().startsWith('http:')) {
    setChip('err', 'https 필요'); if (!silent) toast('https 페이지에서는 https 서버 주소가 필요합니다 (cloudflared 터널 권장)', 4000);
    serverOk = false; updateGen(); return;
  }
  setChip('warn', '확인 중…');
  try {
    const r = await fetch(base() + '/health', { cache: 'no-store' });
    const j = await r.json();
    if (j.ok) { setChip('ok', j.gpu ? `${j.gpu.name.replace('NVIDIA ', '')} · ${j.gpu.vram_gb}GB` : '연결됨'); serverOk = true; }
    else if (j.loading) { setChip('warn', '모델 로딩 중'); serverOk = false; setTimeout(() => ping(true), 5000); }
    else { setChip('err', '모델 오류'); serverOk = false; if (!silent) toast(j.error || '모델 로드 실패', 4000); }
  } catch (e) {
    setChip('err', '연결 실패'); serverOk = false;
    if (!silent) toast('서버에 연결할 수 없습니다. 주소·터널을 확인하세요.', 3500);
  }
  updateGen();
}
$('btnPing').addEventListener('click', () => { srv.dispatchEvent(new Event('change')); ping(false); });
if (base()) ping(true);

/* ---------------- 이미지 ---------------- */
let srcBlob = null;
$('btnCam').addEventListener('click', () => $('fCam').click());
$('btnGal').addEventListener('click', () => $('fGal').click());
['fCam', 'fGal'].forEach((id) => $(id).addEventListener('change', (e) => { const f = e.target.files[0]; if (f) loadImage(f); e.target.value = ''; }));
const drop = $('drop');
drop.addEventListener('dragover', (e) => e.preventDefault());
drop.addEventListener('drop', (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadImage(f); });

async function loadImage(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const max = 1536, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    srcBlob = await new Promise((r) => c.toBlob(r, 'image/png'));
    $('srcImg').src = URL.createObjectURL(srcBlob);
    $('srcImg').classList.remove('hide'); $('dropHint').classList.add('hide');
    updateGen();
  } catch (e) { toast('이미지를 읽을 수 없습니다'); }
}
function updateGen() { $('btnGen').disabled = !(srcBlob && serverOk) || busy; }

/* ---------------- 생성 ---------------- */
let busy = false;
const hist = [];

$('btnGen').addEventListener('click', generate);
async function generate() {
  if (busy) return;
  busy = true; updateGen();
  $('prog').classList.remove('hide'); $('pErr').classList.add('hide'); $('pvImg').classList.add('hide');
  setProg('업로드', 0.02);
  const fd = new FormData();
  fd.append('image', srcBlob, 'input.png');
  fd.append('resolution', getRes());
  fd.append('texture_size', getTex());
  fd.append('decimation', $('dec').value);
  fd.append('seed', $('seedRand').checked ? '-1' : $('seed').value);
  fd.append('steps', $('steps').value);
  fd.append('ss_guidance', $('ssg').value);
  fd.append('shape_guidance', $('shg').value);
  fd.append('tex_guidance', $('txg').value);
  fd.append('remove_bg', $('rmbg').checked ? 'true' : 'false');
  const t0 = Date.now();
  const tick = setInterval(() => ($('pTime').textContent = Math.round((Date.now() - t0) / 1000) + '초'), 500);
  try {
    const r = await fetch(base() + '/jobs', { method: 'POST', body: fd });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || ('HTTP ' + r.status));
    const { id, seed } = await r.json();
    $('seed').value = seed;
    let job;
    for (;;) {
      await new Promise((res) => setTimeout(res, 1500));
      const jr = await fetch(base() + '/jobs/' + id, { cache: 'no-store' });
      if (!jr.ok) throw new Error('작업 상태 조회 실패');
      job = await jr.json();
      setProg(job.stage, job.progress);
      if (job.preview && $('pvImg').classList.contains('hide')) { $('pvImg').src = job.preview; $('pvImg').classList.remove('hide'); }
      if (job.status === 'done') break;
      if (job.status === 'error') throw new Error(job.error || '생성 실패');
    }
    setProg('GLB 다운로드', 0.95);
    const gr = await fetch(base() + '/jobs/' + id + '/glb');
    if (!gr.ok) throw new Error('GLB 다운로드 실패');
    const blob = await gr.blob();
    setProg(`완료 · ${job.elapsed}s`, 1);
    const item = { id, seed, res: job.params.resolution, blob, preview: job.preview || $('srcImg').src, time: new Date() };
    hist.unshift(item); renderHistory();
    showTab('view'); await loadModel(blob, `#${seed} · ${item.res}`);
    toast('3D 모델이 생성되었습니다');
  } catch (e) {
    $('pErr').textContent = e.message; $('pErr').classList.remove('hide'); setProg('오류', 0);
  } finally {
    clearInterval(tick); busy = false; updateGen();
  }
}
function setProg(stage, p) { $('pStage').textContent = stage; $('pBar').style.width = Math.round(p * 100) + '%'; }

function renderHistory() {
  const el = $('histList');
  if (!hist.length) { el.innerHTML = '<p class="muted">아직 생성한 모델이 없습니다.</p>'; return; }
  el.innerHTML = '';
  hist.forEach((h) => {
    const d = document.createElement('div'); d.className = 'hist';
    d.innerHTML = `<img src="${h.preview}" alt=""><div class="meta"><b>시드 ${h.seed}</b>${h.res} · ${(h.blob.size / 1e6).toFixed(1)}MB · ${h.time.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}</div><button>열기</button>`;
    d.querySelector('button').addEventListener('click', async () => { showTab('view'); await loadModel(h.blob, `#${h.seed} · ${h.res}`); });
    el.appendChild(d);
  });
}

/* ================= 뷰어 ================= */
let renderer, scene, camera, controls, pmrem, envTex, ground, modelRoot, currentBlob = null;
let autoRotate = true;
const origMats = new Map();

function initViewer() {
  viewerReady = true;
  const cv = $('cv');
  renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
  camera.position.set(2.2, 1.4, 2.8);
  controls = new OrbitControls(camera, cv);
  controls.enableDamping = true; controls.autoRotate = autoRotate; controls.autoRotateSpeed = 1.2;
  controls.minDistance = 0.4; controls.maxDistance = 12;

  pmrem = new THREE.PMREMGenerator(renderer);
  envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environment = envTex;

  const key = new THREE.DirectionalLight(0xffffff, 1.6);
  key.position.set(2.5, 4, 2); key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  Object.assign(key.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: 0.5, far: 12 });
  key.shadow.radius = 4;
  scene.add(key);

  ground = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShadowMaterial({ opacity: 0.35 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  modelRoot = new THREE.Group(); scene.add(modelRoot);

  // 샘플 (서버 없이 뷰어 확인용)
  const sample = new THREE.Mesh(new THREE.TorusKnotGeometry(0.45, 0.16, 220, 32),
    new THREE.MeshStandardMaterial({ color: 0xc8b48f, roughness: 0.35, metalness: 0.6 }));
  setModel(sample, '샘플');

  new ResizeObserver(resize).observe(cv);
  window.addEventListener('resize', resize);
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
  bindViewerUI();
}

function resize() {
  if (!renderer) return;
  const cv = $('cv'); const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}

function setModel(obj, name) {
  modelRoot.clear(); origMats.clear();
  obj.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = false;
      if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
      origMats.set(o, o.material);
    }
  });
  // 정규화: 최대 변 1.6, 바닥에 붙이기
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3()); const s = 1.6 / Math.max(size.x, size.y, size.z, 1e-6);
  obj.scale.multiplyScalar(s);
  box.setFromObject(obj); const c = box.getCenter(new THREE.Vector3());
  obj.position.sub(new THREE.Vector3(c.x, box.min.y, c.z));
  modelRoot.add(obj);
  $('hudName').textContent = name;
  updateStats(); fit(); applyLook();
}

function fit() {
  const box = new THREE.Box3().setFromObject(modelRoot);
  const sph = box.getBoundingSphere(new THREE.Sphere());
  const d = sph.radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.15;
  const dir = new THREE.Vector3(0.62, 0.38, 0.69).normalize();
  controls.target.copy(sph.center); camera.position.copy(sph.center).addScaledVector(dir, d);
  camera.near = d / 100; camera.far = d * 20; camera.updateProjectionMatrix(); controls.update();
}

function updateStats() {
  let tri = 0, ver = 0;
  modelRoot.traverse((o) => {
    if (!o.isMesh) return;
    const g = o.geometry; ver += g.attributes.position.count;
    tri += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
  });
  $('sTri').textContent = fmt(Math.round(tri)); $('sVer').textContent = fmt(ver);
  $('sSize').textContent = currentBlob ? (currentBlob.size / 1e6).toFixed(1) + 'MB' : '-';
}

async function loadModel(blob, name) {
  if (!viewerReady) initViewer();
  currentBlob = blob;
  const url = URL.createObjectURL(blob);
  try {
    const gltf = await new GLTFLoader().loadAsync(url);
    setModel(gltf.scene, name);
  } catch (e) { toast('GLB를 불러오지 못했습니다'); console.error(e); }
  finally { URL.revokeObjectURL(url); }
}

/* ---------- 표시 모드 & CMF 프리셋 ---------- */
const PRESETS = [
  { id: 'orig', name: '생성 원본', sw: 'conic-gradient(#c96,#69c,#9c6,#c96)' },
  { id: 'pc-black', name: '무광 블랙 PC', color: '#1d1d1f', rough: 0.62, metal: 0, cc: 0 },
  { id: 'gloss-white', name: '글로시 화이트', color: '#f2f1ee', rough: 0.22, metal: 0, cc: 0.8 },
  { id: 'alu', name: '샌드블라스트 알루미늄', color: '#b9bcc0', rough: 0.42, metal: 1, cc: 0 },
  { id: 'hairline', name: '헤어라인 메탈', color: '#c9cbcd', rough: 0.3, metal: 1, cc: 0, aniso: 0.85 },
  { id: 'chrome', name: '크롬', color: '#f4f4f4', rough: 0.04, metal: 1, cc: 0 },
  { id: 'anod-blue', name: '아노다이징 블루', color: '#3c5c86', rough: 0.35, metal: 0.9, cc: 0 },
  { id: 'ceramic', name: '세라믹', color: '#eae6de', rough: 0.12, metal: 0, cc: 1 },
  { id: 'glass', name: '프로스티드 글라스', color: '#e8eef2', rough: 0.38, metal: 0, cc: 0, glass: true },
  { id: 'rubber', name: '소프트터치', color: '#3a3a3c', rough: 0.9, metal: 0, cc: 0, sheen: 0.5 },
];
let mode = 'pbr', preset = 'orig';
const ctl = { color: '#2b2b2d', rough: 0.5, metal: 0, cc: 0 };

function bindViewerUI() {
  seg('segMode', (v) => { mode = v; applyLook(); });
  const sw = $('sw');
  PRESETS.forEach((p) => {
    const b = document.createElement('button'); b.className = 'sw' + (p.id === preset ? ' on' : '');
    b.innerHTML = `<i style="background:${p.sw || p.color}"></i>${p.name}`;
    b.addEventListener('click', () => {
      preset = p.id; sw.querySelectorAll('.sw').forEach((x) => x.classList.toggle('on', x === b));
      if (p.id !== 'orig') { ctl.color = p.color; ctl.rough = p.rough; ctl.metal = p.metal; ctl.cc = p.cc; syncSliders(); }
      if (mode !== 'pbr') { mode = 'pbr'; $('segMode').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.v === 'pbr')); }
      applyLook();
    });
    sw.appendChild(b);
  });
  const live = (id, key, out, f) => $(id).addEventListener('input', (e) => {
    ctl[key] = key === 'color' ? e.target.value : +e.target.value; if (out) $(out).textContent = f(e.target.value);
    if (preset === 'orig') { toast('소재를 먼저 고르면 값이 적용됩니다', 1600); return; }
    applyLook();
  });
  live('col', 'color'); live('ro', 'rough', 'vRo', (v) => (+v).toFixed(2));
  live('me', 'metal', 'vMe', (v) => (+v).toFixed(2)); live('cc', 'cc', 'vCc', (v) => (+v).toFixed(2));
  $('keepColor').addEventListener('change', applyLook);
  $('env').addEventListener('input', (e) => { $('vEnv').textContent = (+e.target.value).toFixed(2); scene.environmentIntensity = +e.target.value; });
  $('envR').addEventListener('input', (e) => { $('vEnvR').textContent = e.target.value + '°'; scene.environmentRotation.y = THREE.MathUtils.degToRad(+e.target.value); });
  $('shadow').addEventListener('change', (e) => (ground.visible = e.target.checked));
  $('btnRot').addEventListener('click', () => { autoRotate = !autoRotate; controls.autoRotate = autoRotate; toast(autoRotate ? '자동 회전 켜짐' : '자동 회전 꺼짐', 1200); });
  $('btnFit').addEventListener('click', fit);
  $('btnDl').addEventListener('click', () => {
    if (!currentBlob) return toast('생성하거나 연 GLB가 없습니다');
    const a = document.createElement('a'); a.href = URL.createObjectURL(currentBlob);
    a.download = 'kmesh_' + Date.now() + '.glb'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  $('btnShot').addEventListener('click', () => {
    renderer.render(scene, camera);
    const a = document.createElement('a'); a.href = $('cv').toDataURL('image/png');
    a.download = 'kmesh_' + Date.now() + '.png'; a.click();
  });
  $('btnOpen').addEventListener('click', () => $('fGlb').click());
  $('fGlb').addEventListener('change', async (e) => { const f = e.target.files[0]; if (f) await loadModel(f, f.name); e.target.value = ''; });
  syncSliders();
}
function syncSliders() {
  $('col').value = ctl.color; $('ro').value = ctl.rough; $('me').value = ctl.metal; $('cc').value = ctl.cc;
  $('vRo').textContent = ctl.rough.toFixed(2); $('vMe').textContent = ctl.metal.toFixed(2); $('vCc').textContent = ctl.cc.toFixed(2);
}

const matCache = new Map();
function disposeCache() { matCache.forEach((m) => m.dispose()); matCache.clear(); }

function makePresetMat(orig) {
  const p = PRESETS.find((x) => x.id === preset);
  const m = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(ctl.color), roughness: ctl.rough, metalness: ctl.metal,
    clearcoat: ctl.cc, clearcoatRoughness: 0.08,
  });
  if ($('keepColor').checked && orig && orig.map) { m.map = orig.map; m.color.set(0xffffff); }
  if (orig && orig.normalMap) { m.normalMap = orig.normalMap; m.normalScale = orig.normalScale; }
  if (p.aniso) { m.anisotropy = p.aniso; m.anisotropyRotation = Math.PI / 2; }
  if (p.glass) { m.transmission = 1; m.thickness = 0.4; m.ior = 1.5; m.metalness = 0; }
  if (p.sheen) { m.sheen = p.sheen; m.sheenRoughness = 0.8; m.sheenColor = new THREE.Color(0x777777); }
  return m;
}

function applyLook() {
  if (!modelRoot) return;
  disposeCache();
  const label = { pbr: preset === 'orig' ? '원본 PBR' : PRESETS.find((p) => p.id === preset).name, clay: '클레이', wire: '와이어프레임', normal: '노멀' };
  $('hudMode').textContent = label[mode];
  origMats.forEach((orig, mesh) => {
    const o = Array.isArray(orig) ? orig[0] : orig;
    let m;
    if (mode === 'clay') m = new THREE.MeshStandardMaterial({ color: 0xcfc8bd, roughness: 0.85, metalness: 0 });
    else if (mode === 'wire') m = new THREE.MeshBasicMaterial({ color: 0xd9c6a3, wireframe: true });
    else if (mode === 'normal') m = new THREE.MeshNormalMaterial();
    else if (preset === 'orig') { mesh.material = orig; return; }
    else m = makePresetMat(o);
    matCache.set(mesh, m); mesh.material = m;
  });
}
